{% extends 'base.html' %}{% block content %}<div class="auth-card"><h2>Create your NearHub account</h2><p class="muted">Choose the account type you want to register.</p><form method="post">
<label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Phone</label><input class="form-control mb-3" name="phone" required>
<label class="form-label">Account type</label><select class="form-select mb-3" name="role" required><option value="">Select role</option><option value="student">Student</option><option value="hostel_owner">Hostel Owner</option><option value="mess_owner">Mess Owner</option></select>
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}

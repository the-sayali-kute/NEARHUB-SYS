{% extends 'base.html' %}{% block content %}<div class="auth-card"><h2>Welcome back</h2><p class="muted">Login to your selected account.</p><form method="post"><label class="form-label">Account type</label><select class="form-select mb-3" name="role" required><option value="student">Student</option><option value="hostel_owner">Hostel Owner</option><option value="mess_owner">Mess Owner</option></select><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><p class="mt-3">New to NearHub? <a href="{{ url_for('register') }}">Register</a></p></div>{% endblock %}

{% extends 'base.html' %}{% block content %}<h1>Find a hostel</h1><form class="filter-bar row g-2 mb-4"><div class="col-md-5"><input class="form-control" name="locality" placeholder="Search locality" value="{{ request.args.get('locality','') }}"></div><div class="col-md-3"><select class="form-select" name="room_type"><option value="">Any room type</option><option>Shared</option><option>Single</option><option>Double</option></select></div><div class="col-md-2"><input class="form-control" name="max_rent" type="number" placeholder="Max rent"></div><div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div></form><div class="row g-3">{% for h in hostels %}<div class="col-md-4"><div class="listing-card p-3"><h5>{{ h.name }}</h5><p class="muted">{{ h.locality }} · {{ h.room_type }}</p><h5>₹{{ h.rent }}/month</h5><p>{{ h.description or '' }}</p><a class="btn btn-outline-primary" href="{{ url_for('hostel_detail',hostel_id=h.id) }}">View details</a></div></div>{% else %}<p>No matching hostels found.</p>{% endfor %}</div>{% endblock %}

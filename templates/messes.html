{% extends 'base.html' %}{% block content %}<h1>Find a mess</h1><form class="row g-2 mb-4"><div class="col-md-6"><input class="form-control" name="locality" placeholder="Search locality"></div><div class="col-md-4"><select class="form-select" name="food_type"><option value="">Any food type</option><option>Veg</option><option>Non-Veg</option><option>Both</option></select></div><div class="col-md-2"><button class="btn btn-primary w-100">Filter</button></div></form><div class="row g-3">{% for m in messes %}<div class="col-md-4"><div class="listing-card p-3"><h5>{{ m.name }}</h5><p class="muted">{{ m.locality }} · {{ m.food_type }}</p><p>{{ m.description or '' }}</p><a class="btn btn-outline-primary" href="{{ url_for('mess_detail',mess_id=m.id) }}">View menu & plans</a></div></div>{% else %}<p>No mess listings found.</p>{% endfor %}</div>{% endblock %}
